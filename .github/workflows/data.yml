name: Build dictionary data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dictionary-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_dictionary.py
      - run: python3 scripts/test_dictionary.py
      - run: python3 scripts/test_japanese.py
      - id: package
        run: python3 scripts/package_data.py
      - name: Publish the archive and propose the new pin
        if: steps.package.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" --title "Dictionary data $TAG" \
            --notes "Generated by run ${{ github.run_id }}. Pinned for app builds by data.lock.json."
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "data/$TAG"
          git add data.lock.json
          git commit -m "Pin dictionary data $TAG"
          git push origin "data/$TAG"
          gh pr create --title "Pin dictionary data $TAG" \
            --body "Updates \`data.lock.json\` to the archive published in release $TAG. Merging deploys this data on the next visit."
