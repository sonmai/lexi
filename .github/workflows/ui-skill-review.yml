name: One-time Lexi UI skill review
on:
  push:
    branches:
      - feat/minimal-dictionary-redesign
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone pinned UI UX Pro Max skill
        run: |
          git clone --quiet https://github.com/nextlevelbuilder/ui-ux-pro-max-skill.git /tmp/ui-skill
          git -C /tmp/ui-skill checkout --quiet 56ea9cf174ed86786187daa9de0e6247cb0747e4
      - name: Generate Lexi design recommendations
        run: |
          python3 /tmp/ui-skill/.claude/skills/ui-ux-pro-max/scripts/search.py "bilingual English Vietnamese dictionary lookup productivity tool minimal content-first mobile web" --design-system -p "Lexi Dictionary" --variance 2 --motion 2 --density 5
      - name: Check accessibility UX recommendations
        run: |
          python3 /tmp/ui-skill/.claude/skills/ui-ux-pro-max/scripts/search.py "keyboard navigation accessible search contrast touch loading" --domain ux -n 3
      - name: Check React stack guidance
        run: |
          python3 /tmp/ui-skill/.claude/skills/ui-ux-pro-max/scripts/search.py "search form performance state" --stack react -n 3
